# Build and deploy the onboarding/ Docusaurus site to GitHub Pages.
#
# Strategy: same-branch deploy. The Markdown sources live under
# `onboarding/` on the `onboarding` branch. This workflow builds them
# with Docusaurus and commits the built static site back to the ROOT
# of the same `onboarding` branch. GitHub Pages serves
# "Deploy from a branch" -> `onboarding` -> `/ (root)`.
#
# Why same-branch: a single ref hosts both the source and the built
# artefacts. No gh-pages branch to keep in sync with the source.
#
# Loop guard: the deploy commit modifies the same branch the workflow
# is triggered on. Two mechanisms prevent the workflow from
# re-triggering itself:
#   1. The commit message ends with `[skip ci]`.
#   2. The `paths-ignore` block below lists every file Docusaurus
#      emits at the repository root. The build step in this workflow
#      is the only thing that modifies those paths.
#
# REPOSITORY SETUP (one-time, manual):
#   Settings -> Pages -> Build and deployment ->
#     Source: Deploy from a branch
#     Branch: onboarding   Folder: / (root)
#
# All third-party actions are pinned to a full 40-character commit SHA
# with the human-readable version in the trailing comment. Tags are
# mutable; SHA pins are not.

name: Build and deploy onboarding docs

on:
  push:
    branches: [onboarding]
    paths-ignore:
      # Docusaurus build output that lands at the repo root after deploy.
      # Verified against `npx docusaurus build` output for this project.
      # Update this list together with the deploy step's cleanup block
      # if Docusaurus changes what it emits.
      - "index.html"
      - "404.html"
      - "search.html"
      - "*.html" # one per chapter (architecture.html, cryptography.html, ...)
      - "search-index.json"
      - "sitemap.xml"
      - "assets/**"
      - "img/**"
      - "katex/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-onboarding-docs
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout onboarding branch
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: onboarding

      - name: Set up Node.js (Active LTS)
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: onboarding/package-lock.json

      - name: Install Node dependencies
        working-directory: onboarding
        run: npm install --no-audit --no-fund

      - name: Audit dependency tree (informational)
        working-directory: onboarding
        run: npm audit --audit-level=moderate || true

      - name: Build Docusaurus site
        working-directory: onboarding
        run: npx docusaurus build

      - name: Stage and deploy built site to branch root
        env:
          DEPLOY_PATHS: |
            index.html
            404.html
            search.html
            search-index.json
            sitemap.xml
            assets
            img
            katex
        run: |
          set -euo pipefail
          # Move the build output to a temp directory so we can clean
          # the previous deploy artefacts from the branch root without
          # touching source directories.
          BUILD_TMP="$(mktemp -d)"
          cp -R onboarding/build/. "$BUILD_TMP"/

          # Remove the previous deploy artefacts only. Never touch
          # source directories (onboarding/, zebrad/, zebra-*/, etc).
          for p in $DEPLOY_PATHS; do
            rm -rf "./$p"
          done
          # Remove any chapter HTML files emitted at root.
          # Each chapter slug (e.g. architecture.html) is generated by
          # Docusaurus from the corresponding docs/ filename.
          find . -maxdepth 1 -type f -name '*.html' -delete

          # Overlay the fresh build at the repository root.
          cp -R "$BUILD_TMP"/. ./

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'No changes in built site; nothing to deploy.'
            exit 0
          fi

          git commit -m 'docs: deploy onboarding site [skip ci]'
          git push origin HEAD:onboarding

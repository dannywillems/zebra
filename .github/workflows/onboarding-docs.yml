# Build and deploy the onboarding/ Docusaurus site to GitHub Pages.
#
# Strategy: GitHub Actions deployment. The Markdown sources live under
# `onboarding/` on the `onboarding` branch. This workflow builds them
# with Docusaurus and publishes the static site as a Pages artifact via
# `actions/deploy-pages`. No rendered output is committed back to the
# branch.
#
# Why Actions deployment (not "Deploy from a branch"):
#   The legacy same-branch strategy pushed a `[skip ci]` deploy commit
#   to `onboarding`, which triggered GitHub's built-in
#   `pages-build-deployment` on BOTH the source commit and the deploy
#   commit. The source-commit deployment was always superseded and
#   showed up as a cancelled run. Publishing the build directly from
#   this workflow produces exactly one deployment per push and keeps
#   the branch free of generated HTML.
#
# REPOSITORY SETUP (one-time, manual):
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   (equivalently: `PATCH /repos/<owner>/<repo>/pages` with
#   `build_type=workflow`).
#
# All third-party actions are pinned to a full 40-character commit SHA
# with the human-readable version in the trailing comment. Tags are
# mutable; SHA pins are not.

name: Build and deploy onboarding docs

on:
  push:
    branches: [onboarding]
    paths:
      - "onboarding/**"
      - ".github/workflows/onboarding-docs.yml"
  workflow_dispatch:

# Least privilege for the Pages deployment. `contents: read` to check
# out, `pages: write` + `id-token: write` for `actions/deploy-pages`.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments to the single Pages environment. Do not cancel
# an in-progress deploy; let it finish so the live site is never left
# half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout onboarding branch
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: onboarding

      - name: Set up Node.js (Active LTS)
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: onboarding/package-lock.json

      - name: Install Node dependencies
        working-directory: onboarding
        run: npm install --no-audit --no-fund

      - name: Audit dependency tree (informational)
        working-directory: onboarding
        run: npm audit --audit-level=moderate || true

      - name: Build Docusaurus site
        working-directory: onboarding
        run: npx docusaurus build

      - name: Upload Pages artifact
        # actions/upload-pages-artifact@v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: onboarding/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
